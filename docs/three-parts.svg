<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">The three parts of the stack</title>
  <desc id="d">Docker runs WordPress, MariaDB, WP-CLI and Mailpit. Your theme folder, your plugin folder and the wp-content folder are mounted into WordPress.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>

  <!-- Part 1: the stack -->
  <rect x="20" y="20" width="860" height="200" rx="14" fill="#eef4fb" stroke="#34527f" stroke-width="2"/>
  <text x="40" y="52" font-size="19" font-weight="700" fill="#142743">1. The stack: compose.yaml and scripts/</text>
  <text x="40" y="76" font-size="14" fill="#4a5568">Runs in Docker. Nothing here goes in your theme or plugin.</text>

  <rect x="40" y="96" width="290" height="104" rx="10" fill="#ffffff" stroke="#34527f" stroke-width="2"/>
  <text x="56" y="124" font-size="16" font-weight="700" fill="#142743">WordPress</text>
  <text x="56" y="146" font-size="13" fill="#4a5568">Official image. Core lives in a</text>
  <text x="56" y="164" font-size="13" fill="#4a5568">Docker volume, never in git.</text>
  <text x="56" y="186" font-size="13" fill="#096a70">http://localhost:8080</text>

  <rect x="350" y="96" width="160" height="104" rx="10" fill="#ffffff" stroke="#34527f" stroke-width="1.5"/>
  <text x="366" y="124" font-size="16" font-weight="700" fill="#142743">MariaDB</text>
  <text x="366" y="146" font-size="13" fill="#4a5568">The database,</text>
  <text x="366" y="164" font-size="13" fill="#4a5568">in its own volume.</text>

  <rect x="530" y="96" width="160" height="104" rx="10" fill="#ffffff" stroke="#34527f" stroke-width="1.5"/>
  <text x="546" y="124" font-size="16" font-weight="700" fill="#142743">WP-CLI</text>
  <text x="546" y="146" font-size="13" fill="#4a5568">Install, import,</text>
  <text x="546" y="164" font-size="13" fill="#4a5568">activate. On demand.</text>

  <rect x="710" y="96" width="150" height="104" rx="10" fill="#ffffff" stroke="#34527f" stroke-width="1.5"/>
  <text x="726" y="124" font-size="16" font-weight="700" fill="#142743">Mailpit</text>
  <text x="726" y="146" font-size="13" fill="#4a5568">Catches every</text>
  <text x="726" y="164" font-size="13" fill="#4a5568">email sent.</text>
  <text x="726" y="186" font-size="13" fill="#096a70">localhost:8025</text>

  <!-- mounts -->
  <line x1="150" y1="318" x2="150" y2="206" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/>
  <line x1="450" y1="318" x2="240" y2="206" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/>
  <line x1="750" y1="318" x2="300" y2="206" stroke="#4a5568" stroke-width="2" marker-end="url(#a)"/>
  <rect x="606" y="240" width="188" height="26" rx="13" fill="#ffffff" stroke="#d9d2c3"/>
  <text x="700" y="258" font-size="13" fill="#4a5568" text-anchor="middle">mounted into WordPress</text>

  <!-- Part 2: theme -->
  <rect x="20" y="320" width="270" height="130" rx="14" fill="#e6f2f1" stroke="#096a70" stroke-width="2"/>
  <text x="40" y="352" font-size="19" font-weight="700" fill="#142743">2. theme/</text>
  <text x="40" y="378" font-size="14" fill="#142743">What the site looks like.</text>
  <text x="40" y="402" font-size="13" fill="#4a5568">Starts as a three-file starter.</text>
  <text x="40" y="422" font-size="13" fill="#4a5568">Or point THEME_DIR at your own.</text>

  <!-- Part 3: plugin -->
  <rect x="315" y="320" width="270" height="130" rx="14" fill="#fbf0dc" stroke="#8a5a00" stroke-width="2"/>
  <text x="335" y="352" font-size="19" font-weight="700" fill="#142743">3. plugin/</text>
  <text x="335" y="378" font-size="14" fill="#142743">Data, settings and API routes.</text>
  <text x="335" y="402" font-size="13" fill="#4a5568">Starts as one REST route.</text>
  <text x="335" y="422" font-size="13" fill="#4a5568">Or point PLUGIN_DIR at your own.</text>

  <!-- wp-content -->
  <rect x="610" y="320" width="270" height="130" rx="14" fill="#f4f1ea" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="630" y="352" font-size="19" font-weight="700" fill="#142743">wp-content/</text>
  <text x="630" y="378" font-size="14" fill="#142743">Everything you did not write.</text>
  <text x="630" y="402" font-size="13" fill="#4a5568">Third-party plugins and themes,</text>
  <text x="630" y="422" font-size="13" fill="#4a5568">and uploads. Not committed.</text>
</svg>
